  });

}

window.renderFrame = function (t) {
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.filter = 'none'; X.globalCompositeOperation = 'source-over';
  X.fillStyle = '#000'; X.fillRect(0, 0, W, H);
  const sc = SCENES.find(s => t >= s[0] && t < s[1]) || SCENES[SCENES.length - 1];
  const lt = t - sc[0];
  // cut punch (scale settle) applied through a temporary canvas
  X.save(); sc[2](X, lt, t); X.restore();
  X.setTransform(1, 0, 0, 1, 0, 0);
  // stadium floodlight bloom on night stadium scenes
  if (sc[3] === 'cold') { bloom(X, 220, 230, 260, '255,250,225', .18); bloom(X, 860, 230, 260, '255,250,225', .18); }
  if (sc[3] === 'sepia') grade(X, 'sepia(0.18) contrast(1.04)');
  if (sc[3] === 'cold') grade(X, 'saturate(0.88) contrast(1.06) brightness(0.97)');
  vignette(X, sc[3] === 'sepia' ? .55 : .38);
  grain(X, t, sc[3] === 'sepia' ? .16 : .06);
  if (sc[3] === 'sepia') { // old film scratches
    const r = rng(Math.floor(t * 24)); X.save(); X.strokeStyle = 'rgba(255,255,240,.25)'; X.lineWidth = 2; for (let i = 0; i < 3; i++) if (r() > .5) { const x = r() * W; X.beginPath(); X.moveTo(x, 0); X.lineTo(x + r() * 6, H); X.stroke(); } X.restore();
  }
  const punch = 1 + 0.05 * Math.max(0, 1 - lt / 0.18);
  if (punch > 1.0005) { TX.clearRect(0, 0, W, H); TX.drawImage(cv, 0, 0); X.save(); X.translate(W / 2, H / 2); X.scale(punch, punch); X.translate(-W / 2, -H / 2); X.drawImage(TMP, 0, 0); X.restore(); }
  // title like "2006 / WORLD CUP FINAL"
  if (t < 3.0) { X.save(); X.globalAlpha = t > 2.8 ? 1 - (t - 2.8) / .2 : 1; bigText(X, [['1974', 'yellow']], 300, 104, 0.1, t); bigText(X, [['RELEGATED', 'red']], 404, 104, 2.08, t); X.restore(); }
  if (t >= 12.38 && t < 14.88) bigText(X, [['18TH', 'red']], 260, 150, 12.42, t);

};
